<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Łukasz 4EI">
    <link rel="stylesheet" href="style.css">
    <title>Szlak - wypożyczalnia</title>
</head>
<body>
    <header>
        <h1>Wypożyczalnia Szlak</h1>

        <nav>
            <a href="#cennik">Cennik</a>
            <a href="#rezerwacja">Rezerwacja</a>
        </nav>
    </header>

    <main>
        <h2>Sprzęt</h2>

        <dl>
            <dt>Namiot 2-os.</dt>
            <dd>40 zł za dobę</dd>

            <dt>Rower trekkingowy</dt>
            <dd>55 zł za dobę</dd>

            <dt>Kajak</dt>
            <dd>70 zł za dobę</dd>
        </dl>

        <h2 id="cennik">Cennik</h2>
        
        <table>
            <tr>
                <th>Sprzęt</th>
                <th>Doba</th>
                <th>Weekend</th>
            </tr>
            <tr>
                <td>Namiot 2-os.</td>
                <td><b>40 zł</b></td>
                <td><b>70 zł</b></td>
            </tr>
            <tr>
                <td>Rower trekkingowy</td>
                <td><b>55 zł</b></td>
                <td><b>95 zł</b></td>
            </tr>
            <tr>
                <td>Kajak</td>
                <td><b>70 zł</b></td>
                <td><b>120 zł</b></td>
            </tr>
        </table>

        <h2 id="rezerwacja">Rezerwacja</h2>

        <form method="post">
            <label for="imie">Imię</label>
            <input type="text" name="imie" id="imie"><br>
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email"><br>
            <label for="sprzet">Sprzęt</label>
            <select name="sprzet">
                <option value="namiot">Namiot 2-os.</option>
                <option value="rower">Rower trekkingowy</option>
                <option value="kajak">Kajak</option>
            </select><br>
            <input type="submit" value="Zarezerwuj">
        </form>
    </main>

    <footer>
        <p>Łukasz 4EI</p>
    </footer>
</body>
</html>
