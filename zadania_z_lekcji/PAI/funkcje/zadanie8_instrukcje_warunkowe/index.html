<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Zadanie 8</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      function wpuscNaImpreze(wiek){
        if(wiek >= 18){
          document.write("Zapraszamy! Masz " + wiek + " lat.<br>");
        }
        else {
          document.write("Niestety, wstęp od 18 lat.<br>");
        }
      }
    </script>
  </head>
  <body>
    <h1>Zadanie 8: Warunki</h1>
    <p>Sprawdzanie wieku w funkcji.</p>
    <div id="wynik">
      <script>
        wpuscNaImpreze(15);
        wpuscNaImpreze(18);
        wpuscNaImpreze(25);
      </script>
    </div>
    <footer>
      Łukasz 4EI
    </footer>
  </body>
</html>
