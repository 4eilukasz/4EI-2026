<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Zadanie 5</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      function przeliczNaMetry(km){
        let metry = km * 1000;
        document.write(km + " kilometr/ów to " + metry + "<br>");
      }
    </script>
  </head>
  <body>
    <h1>Zadanie 5: Return</h1>
    <p>Przeliczanie kilometrów na metry.</p>
    <div id="wynik">
      <script>
        przeliczNaMetry(5);
        przeliczNaMetry(1.5);
      </script>
    </div>
    <footer>
      Łukasz 4EI
    </footer>
  </body>
</html>
