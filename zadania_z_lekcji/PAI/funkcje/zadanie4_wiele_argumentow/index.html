    <script>
      function poleProstokata(a, b){
        let pole = a * b;
        document.write("Pole prostokata o bokach " + a + " i " + b + " wynosi " + pole + "<br>");
      }
    </script>
  </head>
  <body>
    <h1>Zadanie 4: Wiele argumentów</h1>
    <p>Obliczanie pola prostokąta.</p>
    <div id="wynik">
      <script>
        poleProstokata(5, 10);
        poleProstokata(2.5, 4);
      </script>
    </div>
